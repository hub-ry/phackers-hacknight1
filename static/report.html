<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swatch · your taste</title>
<style>
  :root {
    --paper:#faf9f6; --ink:#14130f; --soft:#6f6c62; --rule:#dcd8cf;
    --sans: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.65 var(--sans); }

  .col { max-width:1180px; margin:0 auto; padding:0 24px 100px; }

  .masthead { padding:44px 0 0; }
  .masthead h1 { font:400 13px/1 var(--sans); letter-spacing:.34em;
                 text-transform:uppercase; margin:0; }
  .masthead nav { margin-top:12px; font:400 12px/1 var(--sans);
                  letter-spacing:.12em; text-transform:uppercase; }
  .masthead nav a { color:var(--soft); text-decoration:none; margin-right:18px; }
  .masthead nav a:hover { color:var(--ink); }
  .rule { border:0; border-top:2px solid var(--rule); margin:26px 0; }

  /* Images only: loved first, then liked, each in the order they were rated. */
  .grid { display:grid; gap:14px; grid-template-columns:repeat(5, minmax(0, 1fr)); }
  .grid a { display:block; min-width:0; }
  .grid img { width:100%; aspect-ratio:4/5; object-fit:contain;
              background:#fff; display:block; border:1px solid var(--rule); }
  .grid a:hover img { border-color:var(--ink); }

  .note { color:var(--soft); }
  .quiet { margin-top:64px; padding-top:20px; border-top:1px solid var(--rule); }
  .quiet button { font:400 11px/1 var(--sans); letter-spacing:.16em;
                  text-transform:uppercase; background:none; border:0;
                  border-bottom:1px solid var(--rule); color:var(--soft);
                  padding:0 0 4px; cursor:pointer; }
  .quiet button:hover { color:#a33; border-color:#a33; }

  @media (max-width:480px) {
    .grid { gap:6px; }
  }
</style>
</head>
<body>
<div class="col">
  <div class="masthead">
    <h1>Swatch</h1>
    <nav><a href="/">Swipe</a><a href="/brands/">Brands</a><a href="/report">Taste</a></nav>
  </div>
  <hr class="rule">
  <div id="out"><p class="note">Loading…</p></div>
</div>

<script>
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

const tile = p => `<a href="${esc(p.link)}" target="_blank" rel="noopener">
  <img src="${esc(p.image)}" alt="${esc(p.title)}" title="${esc(p.title)}" loading="lazy"></a>`;

async function load() {
  const d = await fetch('/api/liked').then(r => r.json());
  const out = document.getElementById('out');
  const kept = d.loved.concat(d.liked);

  if (!kept.length) {
    out.innerHTML = `<p class="note">Swipe right or up on something and it shows up here.</p>`;
    return;
  }

  out.innerHTML = `<div class="grid">${kept.map(tile).join('')}</div>
    <div class="quiet"><button id="reset">Clear my taste</button></div>`;

  document.getElementById('reset').onclick = async () => {
    if (!confirm('Delete all ' + d.rated + ' ratings? This cannot be undone.')) return;
    await fetch('/api/reset', {method: 'POST'});
    load();
  };
}
load();
</script>
</body>
</html>
