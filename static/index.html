<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Swatch</title>
<style>
  :root {
    --bg:#f5f4f2; --card:#fff; --ink:#16150f; --muted:#8a877d; --line:#e2e0da;
    --nope:#c8443c; --like:#3f8f5e; --love:#3d5fd9;
  }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  body {
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font:15px/1.5 ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    height:100vh; padding:20px 16px 24px;
  }
  header { width:100%; max-width:400px; display:flex;
           justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  h1 { font-size:16px; letter-spacing:.16em; text-transform:uppercase; margin:0; font-weight:600; }
  .meta { font-size:12px; color:var(--muted); }

  /* Cards are stacked absolutely so the one behind shows through during a drag. */
  .deck { position:relative; width:100%; max-width:400px; flex:1; min-height:0; }
  .card {
    position:absolute; inset:0; background:var(--card);
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 6px 22px rgba(0,0,0,.09);
    display:flex; flex-direction:column; touch-action:none; cursor:grab;
  }
  .card.behind { transform:scale(.95) translateY(10px); box-shadow:none; opacity:.7; }
  .card.animate { transition:transform .32s cubic-bezier(.2,.7,.3,1), opacity .32s; }
  .card:active { cursor:grabbing; }
  .card img { flex:1; min-height:0; width:100%; object-fit:contain;
              background:#fff; pointer-events:none; }
  .info { padding:11px 14px 13px; border-top:1px solid var(--line); }
  .title { font-size:14px; font-weight:500; line-height:1.3; color:inherit;
           text-decoration:none; display:block;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sub { font-size:12px; color:var(--muted); margin-top:3px;
         display:flex; justify-content:space-between; }
  .brand { text-transform:uppercase; letter-spacing:.08em; }
  .title:hover { text-decoration:underline; }
  .buy { color:var(--love); }
  /* The info strip is the one part of the card that must stay clickable,
     so it opts out of the drag gesture the rest of the card owns. */
  .info { touch-action:auto; }

  /* Verdict stamps fade in proportionally to drag distance. */
  .stamp {
    position:absolute; top:22px; padding:6px 14px; border:3px solid;
    border-radius:8px; font-size:18px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; opacity:0; pointer-events:none;
  }
  .stamp.nope { right:18px; color:var(--nope); border-color:var(--nope); transform:rotate(14deg); }
  .stamp.like { left:18px;  color:var(--like); border-color:var(--like); transform:rotate(-14deg); }
  .stamp.love { left:50%; top:40%; margin-left:-64px; width:128px; text-align:center;
                color:var(--love); border-color:var(--love); }

  .foot { max-width:400px; width:100%; margin-top:12px; display:flex;
          justify-content:space-between; font-size:11px; color:var(--muted); }
  .foot button { font:inherit; background:none; border:none; color:var(--muted);
                 text-decoration:underline; cursor:pointer; padding:0; }
  /* Keyboard hints on laptops, swipe hints on touch devices. */
  .hint.touch { display:none; }
  @media (pointer: coarse) {
    .hint.key { display:none; }
    .hint.touch { display:inline; }
  }
  .empty { display:flex; align-items:center; justify-content:center;
           height:100%; color:var(--muted); }
</style>
</head>
<body>
  <header><h1>Swatch</h1><div class="meta" id="meta">loading</div></header>
  <div class="deck" id="deck"><div class="empty">loading corpus…</div></div>
  <div class="foot">
    <span class="hint key">← nope · → like · ↑ love · space skip</span>
    <span class="hint touch">swipe ← nope · → like · ↑ love</span>
    <button id="undo">undo</button>
  </div>

<script>
const NOPE = 1, LIKE = 2, LOVE = 3;
const THRESH_X = 110;   // horizontal px before a drag counts as a verdict
const THRESH_Y = 110;   // upward px for a super swipe

let queue = [], rated = 0, busy = false;

const el = id => document.getElementById(id);

async function refill() {
  const r = await fetch('/api/queue').then(r => r.json());
  queue = r.cards; rated = r.rated;
  el('meta').textContent = `${r.rated} rated · ${r.mode}`;
  render();
}

function cardHTML(c, behind) {
  return `<div class="card${behind ? ' behind' : ''}">
    <span class="stamp nope">nope</span>
    <span class="stamp like">like</span>
    <span class="stamp love">love it</span>
    <img src="${c.image}" alt="" draggable="false">
    <div class="info">
      <a class="title" href="${c.link}" target="_blank" rel="noopener noreferrer">${c.title.replace(/</g,'&lt;')}</a>
      <div class="sub">
        <span class="brand">${c.brand}</span>
        <span>${c.price ? '$'+c.price : ''}<span class="buy"> · buy ↗</span></span>
      </div>
    </div></div>`;
}

function render() {
  const deck = el('deck');
  if (!queue.length) { deck.innerHTML = '<div class="empty">nothing left to rate</div>'; return; }
  // Render the next card first so it paints *behind* the active one.
  deck.innerHTML = (queue[1] ? cardHTML(queue[1], true) : '') + cardHTML(queue[0], false);
  attachDrag(deck.querySelector('.card:last-child'));
  if (queue[2]) new Image().src = queue[2].image;
}

/* Drag: translate + rotate the card, and fade in whichever stamp the
   current offset implies. Release past a threshold commits the rating. */
function attachDrag(card) {
  let sx = 0, sy = 0, dx = 0, dy = 0, down = false;

  const stamps = {
    [NOPE]: card.querySelector('.stamp.nope'),
    [LIKE]: card.querySelector('.stamp.like'),
    [LOVE]: card.querySelector('.stamp.love'),
  };

  const verdict = () => {
    if (-dy > THRESH_Y && Math.abs(dx) < THRESH_X) return LOVE;
    if (dx > THRESH_X) return LIKE;
    if (dx < -THRESH_X) return NOPE;
    return 0;
  };

  const paint = () => {
    card.style.transform =
      `translate(${dx}px, ${dy}px) rotate(${dx * 0.045}deg)`;
    const up = Math.max(0, -dy);
    for (const k in stamps) stamps[k].style.opacity = 0;
    if (up > Math.abs(dx)) stamps[LOVE].style.opacity = Math.min(1, up / THRESH_Y);
    else if (dx > 0) stamps[LIKE].style.opacity = Math.min(1, dx / THRESH_X);
    else if (dx < 0) stamps[NOPE].style.opacity = Math.min(1, -dx / THRESH_X);
  };

  card.addEventListener('pointerdown', e => {
    if (busy) return;
    // Taps on the buy link must reach the anchor, not start a drag.
    if (e.target.closest('a')) return;
    down = true; sx = e.clientX; sy = e.clientY;
    card.classList.remove('animate'); card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', e => {
    if (!down) return;
    dx = e.clientX - sx; dy = e.clientY - sy; paint();
  });
  const release = () => {
    if (!down) return;
    down = false;
    const v = verdict();
    if (v) commit(v, card);
    else { card.classList.add('animate'); dx = dy = 0; paint(); }
  };
  card.addEventListener('pointerup', release);
  card.addEventListener('pointercancel', release);
}

function flyOut(card, v) {
  card.classList.add('animate');
  const off = v === LOVE ? 'translate(0, -130%) rotate(0deg)'
            : v === LIKE ? 'translate(150%, 40px) rotate(22deg)'
                         : 'translate(-150%, 40px) rotate(-22deg)';
  card.style.transform = off;
  card.style.opacity = 0;
}

async function commit(v, card) {
  if (busy) return;
  busy = true;
  const c = queue.shift();
  if (card) flyOut(card, v);
  rated++;
  el('meta').textContent = `${rated} rated`;

  const done = fetch('/api/rate', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({uid: c.uid, rating: v})
  });

  // Let the card finish flying before the next one snaps into place.
  setTimeout(async () => {
    await done;
    busy = false;
    if (queue.length < 4 || rated % 12 === 0) await refill();
    else render();
  }, card ? 300 : 0);
}

function skip() {
  if (busy || !queue.length) return;
  queue.shift();   // not recorded: a skip carries no preference signal
  render();
  if (queue.length < 4) refill();
}

document.addEventListener('keydown', e => {
  if (!queue.length) return;
  const card = el('deck').querySelector('.card:last-child');
  if (e.key === 'ArrowLeft')  { e.preventDefault(); commit(NOPE, card); }
  if (e.key === 'ArrowRight') { e.preventDefault(); commit(LIKE, card); }
  if (e.key === 'ArrowUp')    { e.preventDefault(); commit(LOVE, card); }
  if (e.key === ' ')          { e.preventDefault(); skip(); }
});

el('undo').onclick = async () => { await fetch('/api/undo', {method:'POST'}); await refill(); };

refill();
</script>
</body>
</html>
